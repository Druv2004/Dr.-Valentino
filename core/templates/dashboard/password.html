{% extends 'dashboard/base.html' %}{% block title %}My password{% endblock %}{% block breadcrumb %}My password{% endblock %}
{% block content %}
<div class="heading"><div><span class="eyebrow">SECURITY</span><h1>Change your password</h1></div></div>
<section class="panel form-panel narrow"><form method="post" class="stack-form">{% csrf_token %}{% for f in form %}<label>{{ f.label }}{{ f }}{% if f.errors %}<small class="err">{{ f.errors }}</small>{% endif %}{% if f.help_text %}<small style="font-weight:400;color:#a0a8b0">{{ f.help_text|safe }}</small>{% endif %}</label>{% endfor %}<button class="primary-btn">Change password</button></form></section>
{% endblock %}
