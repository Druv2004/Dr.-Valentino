{% load site_tags %}
{% if page.paginator.num_pages > 1 %}
<nav class="pager" aria-label="Pages">
  {% if page.has_previous %}<a href="?{% qs_without 'page' %}page={{ page.previous_page_number }}">Previous</a>{% endif %}
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?{% qs_without 'page' %}page={{ page.next_page_number }}">Next</a>{% endif %}
</nav>
{% endif %}
